            JUMP
        </button>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'duck') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crystal') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
                    osc.start(now);
                    osc.stop(now + 0.24);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.warn("Audio Context Warning:", e);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isRunning = false;
        let score = 0;
        let crystalsCollected = 0;
        let highScore = parseInt(localStorage.getItem('cyberrunner_highscore') || '0', 10);
        document.getElementById('highScoreDisplay').innerText = highScore;

        let frameCount = 0;
        let gameSpeed = 5;

        // Player configuration
        const player = {
            x: 50,
            y: 0,
            normalWidth: 32,
            normalHeight: 48,
            duckHeight: 24,
            width: 32,
            height: 48,
            vy: 0,
            jumpPower: -13.5,
            gravity: 0.7,
            grounded: false,
            isDucking: false,
            color: '#00f3ff',
            trail: []
        };

        let obstacles = [];
        let crystals = [];
        let particles = [];

        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function resetGame() {
            score = 0;
            crystalsCollected = 0;
            gameSpeed = 5;
            frameCount = 0;
            obstacles = [];
            crystals = [];
            particles = [];

            player.x = Math.max(30, canvas.width * 0.12);
            player.height = player.normalHeight;
            player.width = player.normalWidth;
            player.y = canvas.height - 60 - player.height;
            player.vy = 0;
            player.isDucking = false;
            player.trail = [];

            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('multiplierDisplay').innerText = 'x1 Multiplier';
        }

        function startGame() {
            initAudio();
            resetGame();
            isRunning = true;
            document.getElementById('uiOverlay').classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isRunning = false;
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyberrunner_highscore', highScore.toString());
                document.getElementById('highScoreDisplay').innerText = highScore;
            }

            document.getElementById('overlayTitle').innerText = "GAME OVER";
            document.getElementById('overlaySubtitle').innerText = "Sistem Cyber terkendala! Kamu menabrak rintangan.";
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalCrystals').innerText = crystalsCollected;
            document.getElementById('finalHighScore').innerText = highScore;
            document.getElementById('finalStats').classList.remove('hidden');
            document.getElementById('startBtn').innerText = "Main Lagi";
            document.getElementById('uiOverlay').classList.remove('hidden');
        }

        function triggerJump() {
            if (player.grounded && !player.isDucking) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
        }

        function setDuck(ducking) {
            if (player.grounded && ducking && !player.isDucking) {
                player.isDucking = true;
                player.height = player.duckHeight;
                player.y += player.normalHeight - player.duckHeight;
                playSound('duck');
            } else if (!ducking && player.isDucking) {
                player.isDucking = false;
                player.y -= player.normalHeight - player.duckHeight;
                player.height = player.normalHeight;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                e.preventDefault();
                triggerJump();
            }
            if (['ArrowDown', 'KeyS'].includes(e.code)) {
                e.preventDefault();
                setDuck(true);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowDown', 'KeyS'].includes(e.code)) {
                setDuck(false);
            }
        });

        // Touch Control Buttons
        const btnJump = document.getElementById('btnJump');
        const btnDuck = document.getElementById('btnDuck');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });
        btnJump.addEventListener('mousedown', (e) => { e.preventDefault(); triggerJump(); });

        btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); setDuck(true); });
        btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); setDuck(false); });
        btnDuck.addEventListener('mousedown', (e) => { e.preventDefault(); setDuck(true); });
        btnDuck.addEventListener('mouseup', (e) => { e.preventDefault(); setDuck(false); });

        // Audio Toggle Button
        const audioToggleBtn = document.getElementById('audioToggleBtn');
        audioToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioToggleBtn.innerText = soundEnabled ? '🔊 Suara: AKTIF' : '🔇 Suara: MATI';
        });

        document.getElementById('startBtn').addEventListener('click', startGame);

        function update() {
            frameCount++;
            // Gradual Speed Increase
            gameSpeed = 5 + Math.floor(score / 80) * 0.4;
            const multiplier = 1 + Math.floor(score / 150) * 0.5;
            document.getElementById('multiplierDisplay').innerText = `x${multiplier.toFixed(1)} Multiplier`;

            // Player Physics
            const floorY = canvas.height - 50;

            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y + player.height >= floorY) {
                player.y = floorY - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            // Player Trail Effect
            player.trail.push({ x: player.x, y: player.y, width: player.width, height: player.height });
            if (player.trail.length > 6) player.trail.shift();

            // Spawn Obstacles (Ground Block or High Laser)
            if (frameCount % Math.max(35, 95 - Math.floor(score / 30)) === 0) {
                const isHighLaser = Math.random() > 0.55;
                if (isHighLaser) {
                    obstacles.push({
                        x: canvas.width + 20,
                        y: floorY - player.normalHeight - 12,
                        width: 28,
                        height: 20,
                        type: 'laser',
                        color: '#ff007f'
                    });
                } else {
                    obstacles.push({
                        x: canvas.width + 20,
                        y: floorY - 32,
                        width: 30,
                        height: 32,
                        type: 'block',
                        color: '#ff0055'
                    });
                }
            }

            // Spawn Crystals
            if (frameCount % 60 === 0 && Math.random() > 0.3) {
                const crystalY = Math.random() > 0.5 ? floorY - 35 : floorY - 75;
                crystals.push({
                    x: canvas.width + 20,
                    y: crystalY,
                    size: 12,
                    collected: false
                });
            }

            // Move Obstacles & Collision Check
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // AABB Collision Detection
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff007f', 35);
                    gameOver();
                    return;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += Math.floor(10 * multiplier);
                    document.getElementById('scoreDisplay').innerText = score;
                }
            }

            // Move Crystals & Collection
            for (let i = crystals.length - 1; i >= 0; i--) {
                let cry = crystals[i];
                cry.x -= gameSpeed;

                // Collision with player center
                const pCenterX = player.x + player.width / 2;
                const pCenterY = player.y + player.height / 2;
                const dist = Math.hypot(pCenterX - cry.x, pCenterY - cry.y);

                if (dist < player.width / 2 + cry.size) {
                    createParticles(cry.x, cry.y, '#00f3ff', 15);
                    playSound('crystal');
                    crystalsCollected++;
                    score += Math.floor(25 * multiplier);
                    document.getElementById('scoreDisplay').innerText = score;
                    crystals.splice(i, 1);
                    continue;
                }

                if (cry.x + cry.size < 0) {
                    crystals.splice(i, 1);
                }
            }

            // Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const floorY = canvas.height - 50;

            // Draw Neon Floor
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            // Perspective Floor Grid Lines
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.lineWidth = 1;
            const gridOffset = (frameCount * gameSpeed) % 30;
            for (let x = -gridOffset; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, floorY);
                ctx.lineTo(x - 20, canvas.height);
                ctx.stroke();
            }

            // Player Motion Blur Trail
            player.trail.forEach((t, index) => {
                ctx.fillStyle = `rgba(0, 243, 255, ${0.08 * (index + 1)})`;
                ctx.fillRect(t.x, t.y, t.width, t.height);
            });

            // Render Player
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Inner player core
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, player.height - 8);

            // Render Obstacles
            obstacles.forEach(obs => {
                ctx.shadowBlur = 16;
                ctx.shadowColor = obs.color;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(obs.x + 3, obs.y + 3, obs.width - 6, obs.height - 6);
            });

            // Render Crystals
            crystals.forEach(cry => {
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#00f3ff';
                ctx.save();
                ctx.translate(cry.x, cry.y);
                ctx.rotate(frameCount * 0.06);
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath();
                ctx.moveTo(0, -cry.size);
                ctx.lineTo(cry.size, 0);
                ctx.lineTo(0, cry.size);
                ctx.lineTo(-cry.size, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-2, -2, 4, 4);
                ctx.restore();
            });

            // Render Particles
            particles.forEach(p => {
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        // Main Animation Request Loop
        function gameLoop() {
            if (!isRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initial Draw to Render Background Grid
        draw();
    </script>
</body>
</html>
